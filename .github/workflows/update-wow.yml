name: Mise à jour des cartes WoW

on:
  schedule:
    - cron: '17 4 * * 1'   # chaque lundi vers 6 h (heure de Paris)
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer l'outil de lecture des pages
        run: npm install --no-save --no-package-lock cheerio@1.0.0
      - name: Récupérer les cartes sur WoWTCGFR
        run: node scripts/fetch-wow.mjs
      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/wow-cards.json
          if git diff --cached --quiet; then
            echo "Aucune nouveauté."
          else
            git commit -m "Mise à jour des cartes WoW"
            git push
          fi
